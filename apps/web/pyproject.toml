[project]
name = "co5151-web"
version = "0.1.0"
description = "Chainlit chat UI for the Advisor: demo login, model picker, multi-turn chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chainlit>=2.12,<3",
    "co5151-contracts",
    "co5151-student-server",
    "co5151-advisor",
]

[project.scripts]
co5151-web = "co5151_web.cli:main"

[tool.uv.sources]
co5151-contracts = { workspace = true }
co5151-student-server = { workspace = true }
co5151-advisor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co5151_web"]

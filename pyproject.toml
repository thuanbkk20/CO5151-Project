# Virtual workspace root — mỗi thành phần là một package uv riêng.
# Thành viên phụ trách thêm package của mình vào `members` khi đã có pyproject.toml.
[tool.uv.workspace]
members = [
    "packages/contracts",
    "mcp/student-server",
    "mcp/regulation-server",
    "eval",
    "services/advisor",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# Explicit, otherwise the top-level mcp/ folder makes ruff treat the MCP SDK as first-party.
src = ["packages/contracts/src", "mcp/student-server/src", "mcp/regulation-server/src", "eval/src", "services/advisor/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# Default (prepend) import mode: importlib mode would synthesize a `mcp` package from the
# `mcp/` folder and shadow the MCP SDK. Keep test file names unique across packages.
addopts = "-q"
testpaths = ["packages/contracts/tests", "mcp/student-server/tests", "mcp/regulation-server/tests", "eval/tests", "services/advisor/tests"]

[tool.ruff.lint.isort]
known-first-party = ["co5151_contracts", "student_server", "regulation_server", "co5151_eval", "co5151_advisor"]


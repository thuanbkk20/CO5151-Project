# Virtual workspace root — mỗi thành phần là một package uv riêng.
# Thành viên phụ trách thêm package của mình vào `members` khi đã có pyproject.toml.
[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"

[project]
name = "co5151-student-server"
version = "0.1.0"
description = "Student Record MCP — scoped, read-only access to the logged-in student's academic records"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "co5151-contracts",
    "mcp>=1.30,<3",
]

[project.scripts]
student-mcp = "student_server.cli:main"

[tool.uv.sources]
co5151-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/student_server"]

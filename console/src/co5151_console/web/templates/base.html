<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Console{% endblock %} · G3</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="sidebar">
    <div class="brand">G3 Console</div>
    {% for path, label in nav %}
      <a href="{{ path }}" class="{{ 'active' if request.url.path == path or (path != '/' and request.url.path.startswith(path)) }}">{{ label }}</a>
    {% endfor %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

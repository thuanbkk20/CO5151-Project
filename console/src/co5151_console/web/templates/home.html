{% extends "base.html" %}
{% block title %}Tổng quan{% endblock %}
{% block content %}
<h1>Tổng quan</h1>
<div class="cards">
  {% for path, name, description in features %}
  <a class="card" href="{{ path }}">
    <strong>{{ name }}</strong>
    <span class="muted">{{ description }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}

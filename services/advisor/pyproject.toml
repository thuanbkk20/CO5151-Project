[project]
name = "co5151-advisor"
version = "0.1.0"
description = "Advisor Agent: decision planner, scoped student evidence executor and privacy-aware memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "co5151-contracts",
    "co5151-student-server",
    "co5151-eval",
    "pydantic>=2",
]

[tool.uv.sources]
co5151-contracts = { workspace = true }
co5151-student-server = { workspace = true }
co5151-eval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co5151_advisor"]

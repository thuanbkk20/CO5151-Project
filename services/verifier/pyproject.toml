[project]
name = "co5151-verifier"
version = "0.1.0"
description = "Compliance Verifier: checks the Advisor's draft against the evidence and returns pass / revise / refuse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "co5151-contracts",
]

[tool.uv.sources]
co5151-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co5151_verifier"]

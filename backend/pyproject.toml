[project]
name = "co5151-backend"
version = "0.1.0"
description = "Backend API: sign-in, chat (sync and SSE), conversation history; Advisor and Verifier agents behind ports"
requires-python = ">=3.10"
dependencies = [
    "co5151-contracts",
    # Only for its demo account table (mockdata/accounts.json), the stand-in for the university SSO
    "co5151-student-server",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
    "openai>=1.0",
    "mcp>=1.30,<3",
    "httpx>=0.27",
    "pydantic>=2",
    # One version for every Python the CI runs: 2.1 needs Python 3.11
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Driver for a PostgreSQL server: CHAT_DATABASE_URL=postgresql+asyncpg://user:pass@host/db
postgres = ["asyncpg>=0.29"]

[project.scripts]
co5151-api = "co5151_backend.cli:main"

[tool.uv.sources]
co5151-contracts = { workspace = true }
co5151-student-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co5151_backend"]

[project]
name = "co5151-web"
version = "0.1.0"
description = "Chainlit chat UI: a client of the backend API (sign-in, conversations, streamed answers)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chainlit>=2.12,<3",
    "httpx>=0.27",
    "co5151-contracts",
]

[project.scripts]
co5151-web = "co5151_web.cli:main"

[tool.uv.sources]
co5151-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co5151_web"]

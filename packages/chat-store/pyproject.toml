[project]
name = "co5151-chat-store"
version = "0.1.0"
description = "Long-term chat history per user: conversations, messages and one trace per answer, on SQLite or PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # One version for every Python the CI runs: 2.1 needs Python 3.11
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Driver for a PostgreSQL server: CHAT_DATABASE_URL=postgresql+asyncpg://user:pass@host/db
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co5151_chat_store"]

[project]
name = "co5151-contracts"
version = "0.1.0"
description = "Shared tool contracts (envelope, error codes, schemas) for the CO5151 G3 agentic RAG system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co5151_contracts"]
